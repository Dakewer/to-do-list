name: Deploy (Continuous Deployment)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a desplegar (ej. v1.0.0)"
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Obtener IP y llave SSH desde el tfstate remoto
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          echo "EC2_IP=$(terraform output -raw instance_public_ip)" >> "$GITHUB_ENV"
          terraform output -raw private_key_pem > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"

      - name: Descargar el release en la EC2 y reiniciar el servidor
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/todo-list-api-${TAG}.zip"
          ssh -i "$RUNNER_TEMP/key.pem" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ec2-user@"$EC2_IP" \
              "sudo URL='$URL' TAG='$TAG' bash -s" < scripts/deploy_remote.sh

      - name: Confirmar versión con GET /version
        run: |
          for i in $(seq 1 12); do
            RUNNING=$(curl -fsS --max-time 5 "http://$EC2_IP:8000/version" | jq -r .version || true)
            echo "Intento $i: version corriendo = '$RUNNING' (esperada: $TAG)"
            [ "$RUNNING" = "$TAG" ] && exit 0
            sleep 5
          done
          echo "La versión desplegada no coincide con $TAG" >&2
          exit 1
