name: Health check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Obtener IP desde el tfstate remoto
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          echo "EC2_IP=$(terraform output -raw instance_public_ip)" >> "$GITHUB_ENV"

      - name: GET /health
        run: |
          RESPONSE=$(curl -sS --max-time 10 "http://$EC2_IP:8000/health" || true)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.status // "FAIL"')
          [ "$STATUS" = "OK" ] || { echo "Health check FALLO" >&2; exit 1; }
